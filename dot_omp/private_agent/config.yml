# OMP 18.2.10：按用户确认的模型角色配置。
# agents/*.md 注册自定义子代理；rules/shinax-global-core.md 加载全局持续规则。

modelRoles:
  default: openai-codex/gpt-6-sol:max
  smol: openai-codex/gpt-6-luna:max
  slow: openai-codex/gpt-6-astra:max
  plan: openai-codex/gpt-6-astra:high
  commit: openai-codex/gpt-6-luna:max
  vision: openai-codex/gpt-6-astra:high
  tiny: deepseek/deepseek-flash:low
  memory: openai-codex/gpt-6-luna:high
  advisor: openai-codex/gpt-6-sol:max
  task: devin/swe-2:max
  explore: openai-codex/gpt-6-luna:xhigh
  designer: devin/swe-2:max
  reviewer: openai-codex/gpt-6-sol:max
  security_review: openai-codex/gpt-6-astra:high
  quick_task: openai-codex/gpt-6-luna:xhigh

modelRoleStorage: global
cycleOrder: [smol, default, slow]
# 只影响存在歧义的模型选择；具体角色仍使用完整 provider/model。
modelProviderOrder: [openai-codex, devin, deepseek]
includeModelInPrompt: true
defaultThinkingLevel: high
hideThinkingBlock: false
textVerbosity: low
personality: pragmatic

task:
  eager: default
  batch: true
  # 按任务开放隔离工作区；未指定 isolated 的任务仍使用当前工作区。
  isolation:
    enabled: true
    # 保留补丁/分支产物，由主代理检查后应用并验证，无需额外用户确认。
    apply: false
  # false 只隐藏调用时的 effort 参数，不会关闭 :high / :max 推理。
  enableEffort: false
  maxConcurrency: 4
  # 主代理可创建子代理，子代理不能继续递归委派。
  maxRecursionDepth: 1
  enableLsp: true
  prewalk: false
  showResolvedModelBadge: true
  # 引用角色以继承对应的回退链；不要在此重复维护具体模型。
  agentModelOverrides:
    scout: "@explore"
    explore: "@explore"
    sonic: "@quick_task"
    quick_task: "@quick_task"
    plan: "@plan"
    designer: "@designer"
    task: "@task"
    reviewer: "@reviewer"
    security-reviewer: "@security_review"

providers:
  autoThinkingMaxEffort: xhigh
  cacheRetention: auto
  openai-codex:
    codeMode: auto

retry:
  enabled: true
  maxRetries: 3
  baseDelayMs: 1000
  maxDelayMs: 30000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - devin/swe-2:max
      - deepseek/deepseek-flash:max
    smol:
      - deepseek/deepseek-flash:max
    slow:
      - openai-codex/gpt-6-sol:max
      - devin/swe-2:max
    plan:
      - openai-codex/gpt-6-sol:xhigh
      - devin/swe-2:max
    commit:
      - deepseek/deepseek-flash:low
    vision:
      - openai-codex/gpt-6-sol:high
      - deepseek/deepseek-flash:high
    tiny:
      - openai-codex/gpt-6-luna:low
    memory:
      - deepseek/deepseek-flash:high
    advisor: []
    task:
      - openai-codex/gpt-6-sol:high
      - deepseek/deepseek-flash:high
    explore:
      - deepseek/deepseek-flash:high
    designer:
      - openai-codex/gpt-6-astra:high
      - devin/swe-2:high
    reviewer:
      - openai-codex/gpt-6-astra:xhigh
      - devin/swe-2:max
    security_review:
      - openai-codex/gpt-6-sol:max
      - devin/swe-2:max
    quick_task:
      - deepseek/deepseek-flash:high

advisor:
  enabled: false
  syncBacklog: "off"
  immuneTurns: 3
  maxNotesPerUpdate: 4

tools:
  format: auto
  # 工具调用默认直接放行；仍遵守用户授权和工具自身限制。
  approvalMode: yolo
  intentTracing: true
  # 下列三个大小字段的单位都是 KB，虽然后两个字段名含 Bytes。
  artifactSpillThreshold: 30
  artifactHeadBytes: 5
  artifactTailBytes: 10
  artifactTailLines: 250

bash:
  enabled: true
  allowCompoundCommands: false
  autoBackground:
    enabled: true
    thresholdMs: 30000

eval:
  py: true
  js: true
  tools:
    enabled: true

python:
  kernelMode: session
  interpreter: ""

lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false
  diagnosticsDeduplicate: true

edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
  blockAutoGenerated: true
  streamingAbort: false

read:
  defaultLimit: 300
  summarize:
    enabled: true
    prose: false
  toolResultPreview: false
readLineNumbers: false

# 本方案选用 OMP 原生压缩，不加载 billion-context。
extensions: []
extendedContext: false
contextPromotion:
  enabled: false
compaction:
  enabled: true
  asyncEnabled: true
  midTurnEnabled: true
  methodOrder: [remote, snapcompact, handoff, shake, soft]
  thresholdPercent: 80
  thresholdTokens: -1
  keepRecentTokens: 20000
  autoContinue: true

memory:
  backend: mnemopi
autolearn:
  enabled: false
  autoContinue: false
plan:
  enabled: true
  defaultOnStartup: false

symbolPreset: nerd
theme:
  dark: dark-catppuccin
  light: light
statusLine:
  preset: nerd
  separator: powerline-thin
  transparent: false
  showHookStatus: true
  sessionAccent: true
terminal:
  showImages: true
images:
  autoResize: true
  blockImages: false
tui:
  hyperlinks: auto
  mouse: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
doubleEscapeAction: rewind
autoResume: false
composer:
  shape: band
setupVersion: 2
web_search:
  enabled: true
